name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'repo.json', 'docs/**', 'images/**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile dalamud.zip
          Expand-Archive -Force dalamud.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Test
        run: dotnet test SaucerNights.Tests/SaucerNights.Tests.csproj -c Release

      - name: Build plugin
        run: dotnet build SaucerNights/SaucerNights.csproj -c Release

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: SaucerNights
          path: SaucerNights/bin/Release/SaucerNights/latest.zip
